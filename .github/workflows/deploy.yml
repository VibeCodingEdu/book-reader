# בכל push ל-main: בדיקות → בניית האתר → העלאה ל-GitHub Pages,
# ועדכון ה-Worker ב-Cloudflare (רק אם הוגדר הסוד CLOUDFLARE_API_TOKEN).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  pages:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # כתובת ה-Worker – משתנה (לא סוד) בהגדרות המאגר: Settings → Variables
          VITE_WORKER_URL: ${{ vars.WORKER_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
      - id: deployment
        uses: actions/deploy-pages@v4

  worker:
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_ID: b41762f2a303bb199c16198f09ec43ed
    steps:
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.CLOUDFLARE_API_TOKEN != ''

      # פעם ראשונה בלבד: רישום כתובת חינמית <שם>.workers.dev לחשבון (אם עוד אין)
      - name: Ensure workers.dev subdomain
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          WANT: ${{ vars.WORKERS_SUBDOMAIN || 'vibecodingedu' }}
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/subdomain"
          CUR=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API" | jq -r '.result.subdomain // empty')
          if [ -z "$CUR" ]; then
            echo "Registering subdomain: $WANT"
            curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              --data "{\"subdomain\":\"$WANT\"}" "$API" | jq '{success, errors, result}'
          else
            echo "Subdomain already set: $CUR"
          fi

      # מסד הנתונים D1: יוצר אם אינו קיים, ומכניס את המזהה שלו ל-wrangler.toml
      - name: Ensure D1 database
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/d1/database"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ID=$(curl -s -H "$AUTH" "$API?name=book-reader" | jq -r '.result[]? | select(.name=="book-reader") | .uuid' | head -1)
          if [ -z "$ID" ]; then
            ID=$(curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" --data '{"name":"book-reader"}' "$API" | jq -r '.result.uuid')
            echo "Created D1 database"
          fi
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then echo "Could not get D1 database id"; exit 1; fi
          sed -i "s/__D1_DATABASE_ID__/$ID/" wrangler.toml
      - name: Apply database migrations
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        run: npx wrangler d1 migrations apply book-reader --remote

      - run: npx wrangler deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker

      # מעביר סודות מהכספת של GitHub לכספת של Cloudflare (רק את אלה שהוגדרו)
      - name: Sync worker secrets
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        env:
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: |
          node -e '
            const keys = ["PASSPHRASE","TOKEN_SECRET","ANTHROPIC_API_KEY","GEMINI_API_KEY","GOOGLE_TRANSLATE_API_KEY","GOOGLE_TTS_API_KEY"];
            const out = {};
            for (const k of keys) if (process.env[k]) out[k] = process.env[k];
            console.error("Syncing: " + Object.keys(out).join(", "));
            require("fs").writeFileSync("/tmp/secrets.json", JSON.stringify(out));
          '
          npx wrangler secret bulk /tmp/secrets.json
          rm -f /tmp/secrets.json
