# בדיקות קבלה מול מנועי התרגום האמיתיים. מופעל ידנית בלבד (עולה סנטים בודדים).
# GitHub → Actions → Acceptance → Run workflow. התוצאות מופיעות בטבלה בעמוד הריצה.
name: Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  word-in-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: List available Gemini models
        if: env.GEMINI_API_KEY != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          curl -s -H "x-goog-api-key: $GEMINI_API_KEY" "https://generativelanguage.googleapis.com/v1beta/models?pageSize=200" \
            | jq -r '.models[] | select(.supportedGenerationMethods | index("generateContent")) | .name' | grep -iE "flash" || true
      - run: npx vitest run --config vitest.acceptance.config.ts
        working-directory: worker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
