<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf8f3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LingoRead" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <style>
      /* מסך פתיחה: מוצג עד שהאפליקציה עולה. הצבעים לפי ערכת הצבע השמורה (הסקריפט למטה) */
      :root { --s-bg: #faf8f3; --s-fg: #14213d; --s-ac: #e08a1e; }
      :root[data-theme='dark'] { --s-bg: #0f1522; --s-fg: #ece6da; --s-ac: #f0a24a; }
      :root[data-theme='sepia'] { --s-bg: #f3ebdd; --s-fg: #1f2a44; --s-ac: #c9761a; }
      :root[data-theme='eink'] { --s-bg: #ffffff; --s-fg: #000000; --s-ac: #000000; }
      html { background: var(--s-bg); }
      #splash {
        position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px; background: var(--s-bg); color: var(--s-fg); transition: opacity 300ms ease;
      }
      #splash.gone { opacity: 0; pointer-events: none; }
      :root[data-theme='eink'] #splash { transition: none; }
      #splash svg { width: 112px; height: 112px; animation: splash-in 500ms cubic-bezier(0.2, 0.8, 0.2, 1) both; }
      #splash .name { font: 700 2rem/1 Montserrat, 'Avenir Next', 'Segoe UI', system-ui, sans-serif; letter-spacing: 0.03em; text-transform: uppercase; animation: splash-in 500ms 80ms cubic-bezier(0.2, 0.8, 0.2, 1) both; }
      @keyframes splash-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { #splash svg, #splash .name { animation: none; } }
      :root[data-theme='eink'] #splash svg, :root[data-theme='eink'] #splash .name { animation: none; }
    </style>
    <script>
      // ערכת הצבע לפני הציור הראשון – בלי הבזק לבן בלילה
      try {
        var t = (JSON.parse(localStorage.getItem('reader.deviceSettings.v1') || '{}').theme) || 'light';
        if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <title>LingoRead</title>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="55 42 930 930">
        <defs><mask id="splash-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="1040" height="1040"><rect width="1040" height="1040" fill="#fff"/><path d="M107 688L190 573C330 578 460 620 520 714C580 620 710 578 850 573L933 688C820 700 620 735 520 790C420 735 220 700 107 688Z" fill="#000"/><path d="M132 668L190 573C330 578 460 620 520 714C580 620 710 578 850 573L908 668" fill="none" stroke="#000" stroke-width="82" stroke-linejoin="round"/></mask></defs>
        <g fill="currentColor"><path d="M520 52C546 76 552 126 520 156C488 126 494 76 520 52Z"/><path d="M511 196C468 196 436 166 434 127C480 125 509 152 511 196Z"/><path d="M529 196C572 196 604 166 606 127C560 125 531 152 529 196Z"/><path d="M505.5 352h29v194l-14.5-13-14.5 13zM504 353 520 322 536 353z"/></g>
        <path d="M151 925 520 254 889 925" fill="none" stroke="currentColor" stroke-width="78" stroke-linecap="round" stroke-linejoin="round" mask="url(#splash-cut)"/>
        <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M107 688C250 700 420 735 520 788C620 735 790 700 933 688" stroke-width="42"/><path d="M132 668L190 573C330 578 460 620 520 714C580 620 710 578 850 573L908 668" stroke-width="29"/><path d="M178 639C320 645 450 676 506 746M862 639C720 645 590 676 534 746" stroke-width="30"/></g>
        <path d="M468 822Q520 842 572 822V962L520 925 468 962Z" fill="var(--s-ac)"/>
      </svg>
      <div class="name">LingoRead</div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
